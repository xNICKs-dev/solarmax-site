<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD600" />
      <stop offset="50%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF5100" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 8 Solar Rays -->
  <g stroke="url(#sunGrad)" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="4" x2="32" y2="12" />
    <line x1="32" y1="52" x2="32" y2="60" />
    <line x1="4" y1="32" x2="12" y2="32" />
    <line x1="52" y1="32" x2="60" y2="32" />
    <line x1="12.2" y1="12.2" x2="17.8" y2="17.8" />
    <line x1="46.2" y1="46.2" x2="51.8" y2="51.8" />
    <line x1="12.2" y1="51.8" x2="17.8" y2="46.2" />
    <line x1="46.2" y1="17.8" x2="51.8" y2="12.2" />
  </g>
  <!-- Central Sun Disc -->
  <circle cx="32" cy="32" r="15" fill="url(#sunGrad)" filter="url(#glow)" />
</svg>
